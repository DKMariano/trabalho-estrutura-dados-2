{% extends "base.html" %}

{% block title %}Acesso bloqueado | DGB SIM{% endblock %}

{% block content %}

<section class="py-5 bg-body-tertiary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">

                <div class="card border-0 shadow rounded-4">
                    <div class="card-body p-4 p-lg-5 text-center">

                        <span class="d-inline-flex align-items-center justify-content-center
                                     rounded-circle bg-secondary-subtle text-secondary p-3 mb-3">
                            <i class="bi bi-slash-circle fs-2" aria-hidden="true"></i>
                        </span>

                        <h1 class="h3 fw-bold mb-3">Acesso bloqueado</h1>

                        <p class="fs-5 mb-4">{{ mensagem }}</p>

                        <a href="{{ url_for('inicio') }}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>Voltar para o início
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

{% endblock %}

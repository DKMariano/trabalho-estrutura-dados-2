{% macro banner(titulo, descricao) %}
<section class="card border-primary-subtle shadow-sm mb-4 cliente-banner">
    <div class="card-body p-4">
        <div class="row">
            <div class="col-12 col-lg-7">
                <span class="d-block bg-primary rounded-pill mb-2 barra-destaque"></span>
                <h1 class="fw-bold mb-1">{{ titulo }}</h1>
                <p class="mb-0">{{ descricao }}</p>
            </div>
        </div>
    </div>
</section>
{% endmacro %}


{% macro aviso_simulacao(id, titulo, texto, etapa, cor="primary") %}
<div class="modal fade" id="{{ id }}" tabindex="-1"
     aria-labelledby="{{ id }}Titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title fs-5 fw-bold d-flex align-items-center gap-3"
                    id="{{ id }}Titulo">
                    <span class="d-inline-flex align-items-center justify-content-center
                                 rounded-circle bg-{{ cor }}-subtle text-warning-emphasis p-3">
                        <i class="bi bi-hourglass-split" aria-hidden="true"></i>
                    </span>
                    {{ titulo }}
                </h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Fechar"></button>
            </div>

            <div class="modal-body">
                <p>{{ texto }}</p>
                <p class="mb-0">
                    <span class="badge text-bg-warning">Dados simulados</span>
                    <span class="badge bg-secondary-subtle text-secondary-emphasis">
                        Implementação prevista: Etapa {{ etapa }}
                    </span>
                </p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-{{ cor }}" data-bs-dismiss="modal">
                    Entendi
                </button>
            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var modal = document.getElementById('{{ id }}');

        /* Veio da mesma página? (formulário enviado, página da tabela) */
        var mesmaPagina = false;
        try {
            mesmaPagina = new URL(document.referrer).pathname === location.pathname;
        } catch (erro) { /* sem página anterior: mostra o aviso */ }

        if (!mesmaPagina) {
            bootstrap.Modal.getOrCreateInstance(modal).show();
        }
    });
</script>
{% endmacro %}
